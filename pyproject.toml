[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ultimate-torrent-downloader"
version = "0.1.0"
description = "High-performance, self-hostable torrent downloader bridging a local Windows client with Modal.com serverless compute"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "ranleak" }]
keywords = ["torrent", "modal", "fastapi", "aria2", "downloader", "nsis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
cloud = [
    "modal>=1.6.0",
]

[dependency-groups]
dev = [
    "modal>=1.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.14.0",
]

[project.scripts]
utd = "utd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/utd"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts", "installer"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific rules
]
ignore = [
    "B008",   # FastAPI Depends/Query/File defaults in function signatures
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
